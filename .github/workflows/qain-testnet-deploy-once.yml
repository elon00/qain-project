name: QAIN Testnet Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Deploy QAIN to Solana testnet"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  SOLANA_VERSION: "4.2.0"
  SOLANA_RPC_URL: "https://api.testnet.solana.com"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: solana-testnet
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Build QAIN program
        working-directory: program
        run: cargo build-sbf

      - name: Validate protected deploy credentials
        env:
          DEPLOYER: ${{ secrets.SOLANA_TESTNET_DEPLOYER_KEYPAIR }}
          PROGRAM_KEYPAIR: ${{ secrets.QAIN_SOLANA_PROGRAM_KEYPAIR }}
        run: |
          missing=0
          if [ -z "$DEPLOYER" ]; then
            echo "::error::Missing SOLANA_TESTNET_DEPLOYER_KEYPAIR"
            missing=1
          fi
          if [ -z "$PROGRAM_KEYPAIR" ]; then
            echo "::error::Missing QAIN_SOLANA_PROGRAM_KEYPAIR"
            missing=1
          fi
          exit "$missing"

      - name: Configure signer
        env:
          DEPLOYER: ${{ secrets.SOLANA_TESTNET_DEPLOYER_KEYPAIR }}
          PROGRAM_KEYPAIR: ${{ secrets.QAIN_SOLANA_PROGRAM_KEYPAIR }}
        run: |
          umask 077
          printf '%s' "$DEPLOYER" > "$RUNNER_TEMP/deployer.json"
          printf '%s' "$PROGRAM_KEYPAIR" > "$RUNNER_TEMP/program-keypair.json"
          solana config set --url "$SOLANA_RPC_URL"
          solana config set --keypair "$RUNNER_TEMP/deployer.json"
          echo "PROGRAM_ID=$(solana address -k "$RUNNER_TEMP/program-keypair.json")" >> "$GITHUB_ENV"
          solana balance

      - name: Deploy QAIN program
        id: deploy
        run: |
          set -o pipefail
          solana program deploy             --program-id "$RUNNER_TEMP/program-keypair.json"             --upgrade-authority "$RUNNER_TEMP/program-keypair.json"             program/target/deploy/qain_solana_program.so | tee "$RUNNER_TEMP/deploy-output.txt"
          signature="$(sed -n 's/^Signature: //p' "$RUNNER_TEMP/deploy-output.txt" | tail -1)"
          if [ -n "$signature" ]; then
            echo "DEPLOY_SIGNATURE=$signature" >> "$GITHUB_ENV"
          fi

      - name: Verify executable program
        env:
          QAIN_SOLANA_PROGRAM_ID: ${{ env.PROGRAM_ID }}
        run: node scripts/verify-solana-testnet.mjs

      - name: Write deployment evidence
        env:
          QAIN_SOLANA_PROGRAM_ID: ${{ env.PROGRAM_ID }}
          DEPLOY_SIGNATURE: ${{ env.DEPLOY_SIGNATURE }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: node scripts/write-solana-deployment-evidence.mjs

      - name: Commit verified evidence
        run: |
          git config user.name "qain-deploy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/solana-testnet.json
          git commit -m "chore: record verified QAIN testnet deployment [skip ci]" || exit 0
          git push origin HEAD:gh-pages

      - name: Summary
        run: |
          echo "## QAIN Solana Testnet" >> "$GITHUB_STEP_SUMMARY"
          echo "- Program ID: `$PROGRAM_ID`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Explorer: https://explorer.solana.com/address/$PROGRAM_ID?cluster=testnet" >> "$GITHUB_STEP_SUMMARY"
