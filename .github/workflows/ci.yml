name: CI

on:
  push:
    branches: [ main, master, gh-pages ]
  pull_request:
    branches: [ main, master, gh-pages ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: TypeScript lint
        run: npm run lint

      - name: Application build
        run: npm run build

      - name: x402 protocol tests
        run: npx tsx --test tests/x402.test.ts

      - name: Rust program check
        run: cargo check --manifest-path program/Cargo.toml
